    <text x="458" y="307" text-anchor="middle" fill="#0F172A">Java</text>

    <rect x="495" y="290" width="98" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="544" y="307" text-anchor="middle" fill="#0F172A">Spring Boot</text>

