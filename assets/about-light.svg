<svg width="1100" height="340" viewBox="0 0 1100 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1100" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>

    <linearGradient id="accentLight" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>

    <filter id="shadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <filter id="glowLight" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#06B6D4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1100" height="340" rx="28" fill="url(#bgLight)"/>

  <circle cx="170" cy="55" r="130" fill="#06B6D4" opacity="0.05"/>
  <circle cx="950" cy="300" r="180" fill="#2563EB" opacity="0.04"/>

  <!-- Left panel -->
  <rect x="22" y="22" width="360" height="296" rx="22" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadowLight)"/>
  <text x="42" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#64748B">ASCII PROFILE</text>
  <text x="42" y="67" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#94A3B8">generated from profile photo</text>

  <g filter="url(#glowLight)">
    <text x="40" y="92" xml:space="preserve" font-family="SFMono-Regular,Consolas,Monaco,monospace" font-size="10.5" fill="#0891B2">
      <tspan x="40" dy="0">                       :-=+**+-:..</tspan>
      <tspan x="40" dy="12">                  .:=*%@@@@@@@@@%%#**+-</tspan>
      <tspan x="40" dy="12">               .+#%@@@@@@@@@@@@@@@@@@@@%=</tspan>
      <tspan x="40" dy="12">              -%@@@@@@@@@@@@@%%%@%%@@@@@@=</tspan>
      <tspan x="40" dy="12">             +%@@@@@@%%######*****#%@@%@@%*.</tspan>
      <tspan x="40" dy="12">            .%@@@%#*+=======-----=++***%@@@*</tspan>
      <tspan x="40" dy="12">             #@@%+=---------------====+*%@@#</tspan>
      <tspan x="40" dy="12">             +@%#+==----::--::::---===++*%@#.</tspan>
      <tspan x="40" dy="12">             =@%+==++++++=--:::-=******++*%@:</tspan>
      <tspan x="40" dy="12">             .#%+=+**+*+++=--:-==++++***++%#</tspan>
      <tspan x="40" dy="12">              .#*====+*#*===--==++*#**+=++%-</tspan>
      <tspan x="40" dy="12">             :-=*==-=====--==-==========++*==.</tspan>
      <tspan x="40" dy="12">             .-=*+=--------==-=+==-----=++*-=.</tspan>
      <tspan x="40" dy="12">              :+++=-------==-:-++=----==+*+==</tspan>
      <tspan x="40" dy="12">               -=*+=-----==*+=+*+===-===**+=:</tspan>
      <tspan x="40" dy="12">                :-+==--===++++++++++===+*+=:</tspan>
      <tspan x="40" dy="12">                  :++=-=++++===++**+==+++</tspan>
      <tspan x="40" dy="12">                   -++=------========++*+</tspan>
      <tspan x="40" dy="12">                    ++===----==---==++**+</tspan>
      <tspan x="40" dy="12">                    =++++=-------==+***++.</tspan>
      <tspan x="40" dy="12">                   -==++***+==+=+*##*++++=</tspan>
      <tspan x="40" dy="12">                  :#====++*#######*++++++*=</tspan>
