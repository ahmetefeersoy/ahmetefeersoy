  <text x="430" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0F172A">I'm Ahmet Efe Ersoy</text>
  <text x="430" y="142" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="url(#accentLight)">Backend Engineer • Java &amp; Spring Boot</text>

