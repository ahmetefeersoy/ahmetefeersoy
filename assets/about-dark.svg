<svg
  width="1100"
  height="340"
  viewBox="0 0 1100 340"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient
      id="bgDark"
      x1="0"
      y1="0"
      x2="1100"
      y2="340"
      gradientUnits="userSpaceOnUse"
    >
      <stop stop-color="#0B1120" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="accentDark" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7C3AED" />
      <stop offset="0.5" stop-color="#22D3EE" />
      <stop offset="1" stop-color="#10B981" />
    </linearGradient>

    <filter
      id="shadowDark"
      x="-20%"
      y="-20%"
      width="140%"
      height="140%"
    >
      <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="18"
        flood-color="#000000"
        flood-opacity="0.35"
      />
    </filter>

    <filter
      id="glowDark"
      x="-50%"
      y="-50%"
      width="200%"
      height="200%"
    >
      <feDropShadow
        dx="0"
        dy="0"
        stdDeviation="8"
        flood-color="#22D3EE"
        flood-opacity="0.18"
      />
    </filter>
  </defs>

  <!-- Main background -->
  <rect
    width="1100"
    height="340"
    rx="28"
    fill="url(#bgDark)"
  />

  <!-- Background glow -->
  <circle
    cx="170"
    cy="55"
    r="130"
    fill="#22D3EE"
    opacity="0.05"
  />

  <circle
    cx="950"
    cy="300"
    r="180"
    fill="#7C3AED"
    opacity="0.06"
  />

  <!-- ASCII portrait panel -->
  <rect
    x="22"
    y="22"
    width="360"
    height="296"
    rx="22"
    fill="#0F172A"
    fill-opacity="0.92"
    stroke="#FFFFFF"
    stroke-opacity="0.08"
    filter="url(#shadowDark)"
  />

  <!-- ASCII portrait -->
  <g filter="url(#glowDark)">
    <text
      x="40"
      y="58"
      xml:space="preserve"
      font-family="SFMono-Regular, Consolas, Monaco, monospace"
      font-size="10.5"
      fill="#67E8F9"
    >
      <tspan x="40" dy="0">                       :-=+**+-:..</tspan>
      <tspan x="40" dy="12">                  .:=*%@@@@@@@@@%%#**+-</tspan>
      <tspan x="40" dy="12">               .+#%@@@@@@@@@@@@@@@@@@@@%=</tspan>
      <tspan x="40" dy="12">              -%@@@@@@@@@@@@@%%%@%%@@@@@@=</tspan>
      <tspan x="40" dy="12">             +%@@@@@@%%######*****#%@@%@@%*.</tspan>
      <tspan x="40" dy="12">            .%@@@%#*+=======-----=++***%@@@*</tspan>
      <tspan x="40" dy="12">             #@@%+=---------------====+*%@@#</tspan>
      <tspan x="40" dy="12">             +@%#+==----::--::::---===++*%@#.</tspan>
      <tspan x="40" dy="12">             =@%+==++++++=--:::-=******++*%@:</tspan>
      <tspan x="40" dy="12">             .#%+=+**+*+++=--:-==++++***++%#</tspan>
      <tspan x="40" dy="12">              .#*====+*#*===--==++*#**+=++%-</tspan>
      <tspan x="40" dy="12">             :-=*==-=====--==-==========++*==.</tspan>
      <tspan x="40" dy="12">             .-=*+=--------==-=+==-----=++*-=.</tspan>
      <tspan x="40" dy="12">              :+++=-------==-:-++=----==+*+==</tspan>
      <tspan x="40" dy="12">               -=*+=-----==*+=+*+===-===**+=:</tspan>
      <tspan x="40" dy="12">                :-+==--===++++++++++===+*+=:</tspan>
      <tspan x="40" dy="12">                  :++=-=++++===++**+==+++</tspan>
      <tspan x="40" dy="12">                   -++=------========++*+</tspan>
      <tspan x="40" dy="12">                    ++===----==---==++**+</tspan>
      <tspan x="40" dy="12">                    =++++=-------==+***++.</tspan>
      <tspan x="40" dy="12">                   -==++***+==+=+*##*++++=</tspan>
      <tspan x="40" dy="12">                  :#====++*#######*++++++*=</tspan>
      <tspan x="40" dy="12">                 ..*====+++++++++++++====*-...</tspan>
    </text>
  </g>

  <!-- Information panel -->
  <rect
    x="402"
    y="22"
    width="676"
    height="296"
    rx="22"
    fill="#111827"
    fill-opacity="0.86"
    stroke="#FFFFFF"
    stroke-opacity="0.08"
    filter="url(#shadowDark)"
  />

  <!-- Terminal controls -->
  <circle cx="430" cy="42" r="5" fill="#EF4444" />
  <circle cx="448" cy="42" r="5" fill="#F59E0B" />
  <circle cx="466" cy="42" r="5" fill="#10B981" />

  <!-- Main information -->
  <text
    x="430"
    y="78"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="18"
    fill="#F8FAFC"
  >
    Hi 👋
  </text>

  <text
    x="430"
    y="112"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="30"
    font-weight="700"
    fill="#F8FAFC"
  >
    I'm Ahmet Efe Ersoy
  </text>

  <text
    x="430"
    y="142"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="16"
    font-weight="600"
    fill="url(#accentDark)"
  >
    Backend Engineer • Java &amp; Spring Boot
  </text>

  <!-- Current role -->
  <text
    x="430"
    y="178"
    font-family="Consolas, monospace"
    font-size="14"
    fill="#22D3EE"
  >
    &gt; /current_role
  </text>

  <text
    x="560"
    y="178"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="14"
    fill="#E2E8F0"
  >
    Backend Engineer at SH Bilişim
  </text>

  <!-- Education -->
  <text
    x="430"
    y="202"
    font-family="Consolas, monospace"
    font-size="14"
    fill="#22D3EE"
  >
    &gt; /education
  </text>

  <text
    x="560"
    y="202"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="14"
    fill="#E2E8F0"
  >
    B.Sc. Software Engineering — TED University
  </text>

  <!-- Focus -->
  <text
    x="430"
    y="226"
    font-family="Consolas, monospace"
    font-size="14"
    fill="#22D3EE"
  >
    &gt; /focus
  </text>

  <text
    x="560"
    y="226"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="14"
    fill="#E2E8F0"
  >
    Java, Spring Boot, Kafka, Microservices, Scalable APIs
  </text>

  <!-- Interests -->
  <text
    x="430"
    y="250"
    font-family="Consolas, monospace"
    font-size="14"
    fill="#22D3EE"
  >
    &gt; /interests
  </text>

  <text
    x="560"
    y="250"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="14"
    fill="#E2E8F0"
  >
    Backend Systems, AI-powered systems, LLM integrations
  </text>

  <!-- Location -->
  <text
    x="430"
    y="274"
    font-family="Consolas, monospace"
    font-size="14"
    fill="#22D3EE"
  >
    &gt; /location
  </text>

  <text
    x="560"
    y="274"
    font-family="Segoe UI, Arial, sans-serif"
    font-size="14"
    fill="#E2E8F0"
  >
    Ankara / Kocaeli, Turkey
  </text>
</svg>
